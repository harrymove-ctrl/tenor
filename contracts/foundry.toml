[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
fs_permissions = [{ access = "read-write", path = "./deployments" }]

[fuzz]
runs = 512

[invariant]
runs = 256
depth = 64
fail_on_revert = true

[rpc_endpoints]
mezo_mainnet = "${MEZO_MAINNET_RPC}"
mezo_testnet = "https://rpc.test.mezo.org"
